name: Sync LinkedIn posts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-linkedin-posts.yml"
      - "lib/linkedin.js"
      - "scripts/sync-linkedin-posts.mjs"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-linkedin-posts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch latest kreslix posts
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_VANITY_NAME: kreslix
          LINKEDIN_API_VERSION: "202605"
        run: node scripts/sync-linkedin-posts.mjs

      - name: Publish updated feed data
        run: |
          if git diff --quiet -- public/data/linkedin-posts.json; then
            echo "LinkedIn feed is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/linkedin-posts.json
          git commit -m "Update LinkedIn feed"
          git push
